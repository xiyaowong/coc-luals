name: release-please

on:
  push:
    branches:
      - main
  pull_request:
  # Dispatched by sync-upstream-schema after pushing a schema commit, since
  # pushes made with GITHUB_TOKEN do not trigger other workflows.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # release-please always inspects the default branch, so PR runs would be
    # identical to push runs; only execute on pushes to main and on manual
    # dispatch (used by sync-upstream-schema after a bot push).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    # Publish to npm via Trusted Publishing (OIDC); provenance is attached
    # automatically when authenticating with the workflow's identity.
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm >= 11.5.1; Node 22 ships npm 10.x,
      # which fails OIDC auth with a misleading 404.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
